[[permission]]
identifier = "allow-open-external-url"
description = "在系统浏览器打开 http(s) 链接"
commands.allow = ["open_external_url"]

[[permission]]
identifier = "allow-set-notifications-enabled"
description = "开关桌面通知"
commands.allow = ["set_notifications_enabled"]

[[permission]]
identifier = "allow-take-update-check"
description = "取走托盘发起的检查更新"
commands.allow = ["take_update_check"]

[[permission]]
identifier = "allow-check-desktop-update"
description = "服务未启动时由桌面程序检查并安装更新"
commands.allow = ["check_desktop_update"]

[[permission]]
identifier = "allow-update-channel"
description = "读取和切换更新通道，并按所选通道检查更新"
commands.allow = ["get_update_channel", "set_update_channel", "check_channel_update"]
